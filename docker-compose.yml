services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cordee
      POSTGRES_PASSWORD: cordee
      POSTGRES_DB: cordee
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cordee"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Pas encore branché dans le code : prévu pour l'adaptateur Socket.IO et les files BullMQ (voir docs/06-roadmap.md).
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
